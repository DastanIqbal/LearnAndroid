<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JSONata Evaluator (Return Result to Android)</title>
    <script src="jsonata.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f6f8fa; }
        textarea, input { width: 100%; font-family: monospace; margin-top: 6px; }
        textarea { height: 180px; padding: 8px; }
        .section { margin-bottom: 20px; }
        button { padding: 10px 20px; background-color: #0078d7; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 15px; }
        pre { background: #fff; border: 1px solid #ccc; padding: 10px; min-height: 80px; white-space: pre-wrap; }
        #logs { background: #f0f0f0; border-left: 3px solid #0078d7; padding: 8px; font-size: 13px; color: #333; max-height: 200px; overflow-y: auto; }
    </style>
</head>
<body>
<h1>🧩 JSONata Evaluator (Return Result to Android)</h1>

<div class="section">
    <h3>Input JSON:</h3>
    <textarea id="jsonInput"></textarea>
</div>

<div class="section">
    <h3>JSONata Expression:</h3>
    <input id="expressionInput" />
</div>

<button id="evaluateBtn">Evaluate</button>

<div class="section">
    <h3>Result:</h3>
    <pre id="output">(result will appear here)</pre>
</div>

<div class="section">
    <h3>Debug Log:</h3>
    <div id="logs"></div>
</div>

<script>
    const log = (msg) => {
      const logs = document.getElementById("logs");
      const time = new Date().toLocaleTimeString();
      logs.innerText += `[${time}] ${msg}\n`;
      logs.scrollTop = logs.scrollHeight;
      console.log(msg);
    };

    async function evaluate(jsonText, exprText) {
      document.getElementById("jsonInput").value = jsonText;
      document.getElementById("expressionInput").value = exprText;

      const output = document.getElementById("output");
      const logs = document.getElementById("logs");
      logs.textContent = "";
      output.textContent = "";

      try {
        log("Parsing JSON input...");
        const data = JSON.parse(jsonText);
        log("JSON parsed successfully.");

        log("Compiling JSONata expression...");
        const expr = jsonata(exprText);
        log("Expression compiled: " + exprText);

        log("Evaluating expression...");
        const result = await expr.evaluate(data);
        const resultStr = JSON.stringify(result);

        log("Raw JS result type: " + typeof result);
        log("Raw result: " + resultStr);

        output.textContent = resultStr;
        log("✅ Evaluation completed successfully.");

        // Send result back to Android
        return resultStr;
      } catch (err) {
        output.textContent = "❌ Error: " + err.message;
        log("❌ Error: " + err.stack);
        return JSON.stringify({ error: err.message });
      }
    }
</script>
</body>
</html>
