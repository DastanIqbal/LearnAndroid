plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

android {
    namespace 'com.dastanapps.javascriptengine'
    compileSdk 36

    defaultConfig {
        applicationId "com.dastanapps.javascriptengine"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
    buildFeatures {
        compose true
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.4'
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation platform('androidx.compose:compose-bom:2024.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.09.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    // JavaScript Engine - QuickJS Android (best lightweight JS engine for Android)
    implementation "io.github.taoweiji.quickjs:quickjs-android:1.4.0"

    // JavaScript Engine - J2V8 (more compatible alternative)
    implementation("com.eclipsesource.j2v8:j2v8:6.2.1@aar")

    // JSON serialization for data handling
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.0"

    // Coroutines for async operations
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"

    // JSONata implementations (keeping existing for separate use)
    implementation("com.ibm.jsonata4java:JSONata4Java:2.4.5")
    implementation("com.fasterxml.jackson.core:jackson-core:2.13.0")

    // ViewModel and Compose integration
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4'

    // Alternative JS engines (commented out for reference)
    // implementation("org.graalvm.js:js:21.0.0")               // GraalVM JS - desktop only
    // implementation("org.graalvm.js:js-scriptengine:21.0.0")  // GraalVM JS ScriptEngine
}